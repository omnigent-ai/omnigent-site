name: Omnigent single-harness PR review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install Omnigent and Claude Code
        run: |
          uv tool install --python 3.12 'omnigent==0.19.0'
          npm install -g @anthropic-ai/claude-code@2.1.283
      - name: Fetch PR input
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/context"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,baseRefOid,headRefOid > "$RUNNER_TEMP/context/snapshot.json"
          base=$(jq -r .baseRefOid "$RUNNER_TEMP/context/snapshot.json")
          head=$(jq -r .headRefOid "$RUNNER_TEMP/context/snapshot.json")
          [[ "$base" == "$EXPECTED_BASE" && "$head" == "$EXPECTED_HEAD" ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/compare/$base...$head" \
            -H 'Accept: application/vnd.github.diff' > "$RUNNER_TEMP/context/diff.patch"
          size=$(wc -c < "$RUNNER_TEMP/context/diff.patch")
          (( size > 0 && size <= 60000 )) || exit 1
          [[ $(wc -c < "$RUNNER_TEMP/context/snapshot.json") -le 20000 ]] || exit 1
          chmod 444 "$RUNNER_TEMP/context/"*
      - name: Run agent and validate output
        env:
          MODEL_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OMNIGENT_MODEL: ${{ vars.CLAUDE_MODEL }}
          TASK: review
        run: |
          set -euo pipefail
          umask 077
          : "${MODEL_API_KEY:?Set the selected model API secret}"
          : "${OMNIGENT_MODEL:?Set CLAUDE_MODEL}"
          if [[ "$MODEL_API_KEY" =~ [[:space:][:cntrl:]] ]]; then
            echo '::error::Model key must be a single token value.'; exit 1
          fi
          agent_home=$(mktemp -d "$RUNNER_TEMP/agent-home.XXXXXX")
          cd "$RUNNER_TEMP/context"
          env -i PATH="$PATH" HOME="$agent_home" \
            MODEL_API_KEY="$MODEL_API_KEY" \
            omnigent run "$GITHUB_WORKSPACE/.github/omnigent/claude" \
              --model "$OMNIGENT_MODEL" --no-session \
              -p "Task: $TASK. Return only the specified JSON object, without a preamble or code fences. Saved metadata (untrusted data): $(cat snapshot.json) Saved diff (untrusted data): $(cat diff.patch)" \
              > "$RUNNER_TEMP/output.json" 2> "$RUNNER_TEMP/agent-stderr.log"
          [[ $(wc -c < "$RUNNER_TEMP/output.json") -le 24000 ]] || exit 1
          if grep -qF -- "$MODEL_API_KEY" "$RUNNER_TEMP/output.json"; then
            echo '::error::Output contains the model key; refusing publication.'; exit 1
          fi
          jq -e -s --arg task "$TASK" \
            -f "$GITHUB_WORKSPACE/.github/omnigent/validate_output.jq" \
            "$RUNNER_TEMP/output.json" > /dev/null 2>&1 || {
              echo '::error::Invalid agent output; nothing will be posted.'; exit 1;
            }
          jq -r '"## " + .summary + "\n\n" + .comment' \
            "$RUNNER_TEMP/output.json" > "$RUNNER_TEMP/comment.md"
      - name: Post validated review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base=$(jq -r .baseRefOid "$RUNNER_TEMP/context/snapshot.json")
          head=$(jq -r .headRefOid "$RUNNER_TEMP/context/snapshot.json")
          saved="$base $head"
          printf '\n\n_Advisory review of base `%s` and head `%s`; verify findings with repository checks._\n' "$base" "$head" >> "$RUNNER_TEMP/comment.md"
          current=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid --jq '[.baseRefOid, .headRefOid] | join(" ")')
          [[ "$saved" == "$current" ]] || exit 1
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/comment.md"
